services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD}
      _JAVA_OPTIONS: -Xmx512m
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro

  wolfradio:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LAVALINK_HOST: lavalink
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    # Spotify OAuth callback — bound to this computer only
    ports:
      - "127.0.0.1:${SPOTIFY_CALLBACK_PORT:-8888}:${SPOTIFY_CALLBACK_PORT:-8888}"
      # Activity web app + API (only this computer; Discord reaches it through the tunnel below)
      - "127.0.0.1:${ACTIVITY_PORT:-8080}:${ACTIVITY_PORT:-8080}"
    # The bot keeps retrying until Lavalink is up, so no health check is needed
    depends_on:
      - lavalink

  # Optional: your own music library. Start with `docker compose --profile library up -d`
  navidrome:
    image: deluan/navidrome:latest
    profiles: ["library"]
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
    volumes:
      - ./navidrome-data:/data
      - ${MUSIC_DIR:-./music}:/music:ro

  # WolfRadio V2 (Discord Activity): public HTTPS address for Discord's URL Mapping.
  # Start with COMPOSE_PROFILES=activity (comma-separated with others), then read the address with
  #   docker compose logs tunnel
  # A quick tunnel gets a NEW *.trycloudflare.com address every time it restarts.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["activity"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://wolfradio:${ACTIVITY_PORT:-8080}
    depends_on:
      - wolfradio
